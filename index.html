<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f47b38"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css"><title>TaskFlow</title></head>
<body>
  <main id="app">
    <section id="auth-view" class="auth-shell"><div class="auth-card"><p class="eyebrow">TASKFLOW</p><h1>Make room for what matters.</h1><p>Plan, focus, and build your life—across every device.</p><form id="auth-form"><label>Email<input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input id="password" type="password" required minlength="6" autocomplete="current-password" placeholder="At least 6 characters"></label><button>Continue</button></form><button id="toggle-auth" class="text-button">New here? Create an account</button><p id="auth-message" class="message" role="status"></p></div></section>
    <section id="dashboard" hidden>
      <aside><a class="brand" href="#">TaskFlow<small>Plan · Focus · Build</small></a><nav><button class="nav active" data-view="tasks">☷ Tasks</button><button class="nav" data-view="history">◷ History</button><button class="nav" data-view="stats">▥ Stats</button></nav><div class="aside-bottom"><span id="user-email"></span><button id="sign-out" class="text-button">Sign out</button></div></aside>
      <div class="content"><header><div><p class="eyebrow" id="today"></p><h1 id="greeting">Good day</h1><p>Organize your tasks, make progress, build the life you want.</p></div><div class="header-actions"><input id="search" type="search" placeholder="Search tasks"><button id="add-task">＋ Add task</button></div></header>
        <section id="tasks-view"><div id="status" class="message" role="status"></div><div id="boards" class="boards"></div></section>
        <section id="history-view" hidden><div class="history-head"><div><h2>Completed / History</h2><p>Completed tasks are kept safely here.</p></div><input id="history-search" type="search" placeholder="Search history"></div><div id="history-list" class="history-list"></div></section>
        <section id="stats-view" hidden><h2>Your progress</h2><div id="stats" class="stats"></div></section>
      </div>
    </section>
  </main>
  <dialog id="task-dialog"><form id="task-form" method="dialog"><div class="modal-title"><h2 id="dialog-title">Add task</h2><button type="button" class="close" aria-label="Close">×</button></div><input id="task-id" type="hidden"><label>Title<input id="task-title" required maxlength="200"></label><div class="form-grid"><label>Section<select id="task-section"><option value="current">Current</option><option value="temporary">Temporary</option><option value="life">Life</option><option value="long_term">Long-Term</option></select></label><label>Type<select id="task-type"><option value="project">Project</option><option value="chat">Chat</option><option value="personal">Personal</option><option value="study">Study</option><option value="other">Other</option></select></label></div><label>Progress <output id="progress-output">0%</output><input id="task-progress" type="range" min="0" max="100" value="0"></label><label>Description<textarea id="task-description" maxlength="1000"></textarea></label><label>Notes<textarea id="task-notes" maxlength="2000"></textarea></label><label>Link<input id="task-link" type="url" placeholder="https://…"></label><div class="dialog-actions"><button type="button" id="delete-task" class="danger" hidden>Delete</button><span></span><button type="button" class="cancel">Cancel</button><button id="save-task" value="default">Save task</button></div></form></dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script><script src="/config.js"></script><script src="/app.js"></script>
</body></html>
